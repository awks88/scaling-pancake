{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      containers:
      - name: events-service
        image: {{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
        ports:
          - containerPort: {{ .Values.eventsService.service.targetPort }}
        env:
          - name: PORT
            value: "{{ .Values.eventsService.service.port }}"
          - name: KAFKA_BROKERS
            value: "kafka:9092"
        envFrom:
          - configMapRef:
              name: cinemaabyss-config
          - secretRef:
              name: cinemaabyss-secrets
        resources:
          limits:
            cpu: "200m"
            memory: "192Mi"
          requests:
            cpu: "100m"
            memory: "96Mi"
        readinessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort }}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort }}
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 5
      restartPolicy: Always
      imagePullSecrets:
        - name: dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - port: {{ .Values.eventsService.service.port }}
      targetPort: {{ .Values.eventsService.service.targetPort }}
  selector:
    app: events-service
  type: {{ .Values.eventsService.service.type }}
{{- end }}